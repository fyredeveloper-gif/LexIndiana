name: Package Windows

# The Windows build, in one place. Callers decide when it runs: ci.yml on every
# push and pull request, release.yml when a v* tag is pushed -- so a release
# ships exactly the artifacts these checks signed off on, rather than a second
# copy of the steps that could drift.
on:
  workflow_call:
    outputs:
      installers-artifact:
        description: Artifact holding the NSIS installer and the portable exe
        value: ${{ jobs.package-windows.outputs.installers-artifact }}
      unpacked-artifact:
        description: Artifact holding the unpacked app tree
        value: ${{ jobs.package-windows.outputs.unpacked-artifact }}

permissions:
  contents: read

jobs:
  package-windows:
    name: Windows packaging (NSIS + portable + unpacked)
    runs-on: windows-latest
    timeout-minutes: 30
    # The artifact names live here so callers download what this job uploaded
    # instead of repeating the strings and breaking when one side changes.
    outputs:
      installers-artifact: lex-indiana-windows-installers
      unpacked-artifact: lex-indiana-windows-unpacked

    env:
      DATABASE_URL: file:./dev.db
      AUTH_SECRET: ci-only-secret-at-least-32-characters-long
      APP_URL: http://127.0.0.1:3000
      STORAGE_DRIVER: local
      NEXT_TELEMETRY_DISABLED: "1"
      # No signing certificate exists on CI, and --dir signs nothing anyway.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` also regenerates the Prisma client, which is what makes
      # the Windows query engine present to be packaged.
      - name: Production build
        run: npm run build

      - name: Bundle demo seed
        run: npm run desktop:seed:bundle

      # Builds the NSIS installer and the portable exe from win.target, and the
      # unpacked tree both are packed from, which the next steps inspect.
      # --publish never: electron-builder treats a CI run as publish-on-draft and
      # aborts after packaging when no GH_TOKEN exists. Artifacts are this job's
      # output; release.yml turns them into a release.
      - name: Package app and installers (win x64)
        run: npx electron-builder --win --x64 --config electron-builder.yml --publish never

      # Guards the failure this job exists for: a packaging run that succeeds
      # while the app tree is missing Prisma's generated client, or while it
      # holds a query engine built for a platform or architecture other than
      # Windows x64. Both are passed explicitly so the assertion does not depend
      # on the runner's own platform and architecture.
      - name: Verify packaged app layout
        run: node scripts/desktop-package-check.mjs release/win-unpacked/resources/app --platform win32 --arch x64

      # A complete layout can still hold a query engine that will not load on
      # Windows, so boot the packaged tree and sign in. No window is opened.
      - name: Smoke the packaged app (migrate, seed, sign in)
        run: node scripts/desktop-package-smoke.mjs release/win-unpacked/resources/app

      # A packaging run can report success while one Windows target's file
      # overwrote the other's, so assert both installers are real programs.
      - name: Verify Windows installers
        run: node scripts/desktop-installer-check.mjs release

      # The Version tab and the icon are what a person sees in Explorer, and
      # packaging reports neither: an unset package.json "author" silently
      # leaves Electron's stub "GitHub, Inc." publisher in place, and an icon
      # path that points nowhere is only a log line. Parse the resources of the
      # exes just built and compare them with package.json, electron-builder.yml
      # and assets/icon.ico.
      - name: Verify exe metadata and icons
        run: node scripts/desktop-metadata-check.mjs release

      # What a user downloads: "Lex Indiana Setup <version>.exe" installs per
      # user (no admin prompt), "Lex Indiana Portable <version>.exe" runs without
      # installing. Both are unsigned, so SmartScreen warns on first run.
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: lex-indiana-windows-installers
          path: release/*.exe
          retention-days: 7
          if-no-files-found: error

      # The unpacked app needs no installer or signing, so a Windows PC can
      # unzip this artifact and launch "Lex Indiana.exe" directly.
      - name: Upload unpacked Windows app
        uses: actions/upload-artifact@v4
        with:
          name: lex-indiana-windows-unpacked
          path: release/win-unpacked
          retention-days: 7
          if-no-files-found: error
          # The app's .next build and Prisma's generated .prisma client are
          # dot-directories, and v4 skips hidden files by default -- which
          # uploads an app that cannot start.
          include-hidden-files: true
