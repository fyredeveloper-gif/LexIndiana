name: CI

on:
  push:
  pull_request:
  # Manual runs build the Windows artifact on demand, without a pull request.
  # Set "Windows only" to skip the Linux verify job and package just Windows.
  workflow_dispatch:
    inputs:
      windows_only:
        description: "Skip the Linux verify job and only build the Windows artifact"
        type: boolean
        default: false

permissions:
  contents: read

# Event type is part of the group so a manual Windows-only run does not cancel
# an in-flight push or pull-request build of the same branch.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build, and desktop smokes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A manual run can ask for only the Windows artifact.
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_only

    env:
      # Tests create and migrate their own throwaway SQLite file (.tmp-test/).
      # This value is only needed by commands that load the Prisma datasource.
      DATABASE_URL: file:./dev.db
      AUTH_SECRET: ci-only-secret-at-least-32-characters-long
      APP_URL: http://127.0.0.1:3000
      STORAGE_DRIVER: local
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      # The Electron shell and sync engine are only exercised by these scripts,
      # which boot desktop/server.mjs against the build above. They stay in this
      # job so a pull request pays for one install and one build.
      #
      # The demo seed ships as a pre-built esbuild bundle and both scripts seed
      # a fresh DEMO repository on first launch, so bundle it first.
      - name: Bundle demo seed
        run: npm run desktop:seed:bundle

      - name: Desktop smoke (install config, migrations, seed, settings, WAL)
        run: npm run desktop:smoke

      - name: Sync smoke (bootstrap, peer edit, conflict, offline)
        run: npm run sync:smoke

  # Packaging is the one desktop path the Linux job cannot cover: the app is
  # assembled for Windows, so the files that only exist there (Prisma's Windows
  # query engine among them) are exercised on a runner like the users' machines.
  # --dir stops at the unpacked app, so no installer build and no signing.
  package-windows:
    name: Windows packaging (electron-builder --dir)
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: file:./dev.db
      AUTH_SECRET: ci-only-secret-at-least-32-characters-long
      APP_URL: http://127.0.0.1:3000
      STORAGE_DRIVER: local
      NEXT_TELEMETRY_DISABLED: "1"
      # No signing certificate exists on CI, and --dir signs nothing anyway.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` also regenerates the Prisma client, which is what makes
      # the Windows query engine present to be packaged.
      - name: Production build
        run: npm run build

      - name: Bundle demo seed
        run: npm run desktop:seed:bundle

      - name: Package unpacked app (win x64)
        run: npx electron-builder --dir --win --x64 --config electron-builder.yml

      # Guards the failure this job exists for: a packaging run that succeeds
      # while the app tree is missing Prisma's generated client, or while it
      # holds a query engine built for a platform other than Windows.
      - name: Verify packaged app layout
        run: node scripts/desktop-package-check.mjs release/win-unpacked/resources/app --platform win32

      # A complete layout can still hold a query engine that will not load on
      # Windows, so boot the packaged tree and sign in. No window is opened.
      - name: Smoke the packaged app (migrate, seed, sign in)
        run: node scripts/desktop-package-smoke.mjs release/win-unpacked/resources/app

      # The unpacked app needs no installer or signing, so a Windows PC can
      # unzip this artifact and launch "Lex Indiana.exe" directly.
      - name: Upload unpacked Windows app
        uses: actions/upload-artifact@v4
        with:
          name: lex-indiana-windows-unpacked
          path: release/win-unpacked
          retention-days: 7
          if-no-files-found: error
          # The app's .next build and Prisma's generated .prisma client are
          # dot-directories, and v4 skips hidden files by default -- which
          # uploads an app that cannot start.
          include-hidden-files: true
