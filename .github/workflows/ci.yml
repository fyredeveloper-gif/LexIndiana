name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Tests create and migrate their own throwaway SQLite file (.tmp-test/).
      # This value is only needed by commands that load the Prisma datasource.
      DATABASE_URL: file:./dev.db
      AUTH_SECRET: ci-only-secret-at-least-32-characters-long
      APP_URL: http://127.0.0.1:3000
      STORAGE_DRIVER: local
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
