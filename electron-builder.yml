# Desktop packaging. Windows is the first target; mac/linux targets can be added
# once the dev shell has been validated.
#
# asar is disabled on purpose: Next, Prisma's query engine, and the embedded
# server all spawn child processes and resolve files at runtime, which is the
# most common failure mode when they are packed inside an asar archive.
appId: com.lexindiana.desktop
productName: Lex Indiana
# Publisher shown in the exe's Version tab, Task Manager, and Apps & Features.
# CompanyName comes from package.json "author"; LegalCopyright comes from here,
# because electron-builder reads copyright from the build config, not package.json.
copyright: "Copyright © 2026 Haynes & Haynes Inc"
directories:
  output: release
  # Icon sources. Not "build": that directory holds Next and seed build output
  # and is gitignored, so build resources kept there could never be committed
  # and every release would silently ship Electron's default icon.
  buildResources: assets
asar: false
npmRebuild: false

# Application code that runs at runtime. Production dependencies (next, react,
# @prisma/client, prisma, bcryptjs, ...) are included automatically.
files:
  - desktop/**/*
  - package.json
  - next.config.mjs
  - postcss.config.mjs
  - "!desktop/build/**/*.map"

# Runtime assets copied next to desktop/ (appRoot = resources/app).
extraResources:
  # Prisma generates its client (and query engine binary) into node_modules/.prisma.
  # That directory is not a package, so electron-builder's dependency walk skips
  # it and a `files` pattern cannot reach it; without this the packaged app dies
  # on startup with "Cannot find module '.prisma/client/default'".
  - from: node_modules/.prisma
    to: app/node_modules/.prisma
  - from: .next
    to: app/.next
  - from: public
    to: app/public
  # Migrations and schema only: a local dev database must never ship.
  - from: prisma
    to: app/prisma
    filter:
      - "**/*"
      - "!*.db"
      - "!*.db-wal"
      - "!*.db-shm"

extraMetadata:
  main: desktop/main.mjs

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  # One source for the exe icon, the Start-menu shortcut, the installer and the
  # uninstaller. Derived from the app's own mark in src/app/icon.svg.
  icon: assets/icon.ico
  # No win.artifactName: nsis and portable both produce .exe, so a shared
  # template makes one target overwrite the other's file.

nsis:
  artifactName: ${productName} Setup ${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Lex Indiana
  uninstallDisplayName: Lex Indiana ${version}
  # The SQLite repositories and uploaded documents live in the user's data
  # folder, not the install folder: uninstalling must not delete a firm's data.
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${productName} Portable ${version}.${ext}
