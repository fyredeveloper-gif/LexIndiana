# Render blueprint for the hosted demo / sync target.
#
# The app is SQLite-first (desktop and hosted use the same schema). On Render the
# database and uploaded documents live on a persistent disk mounted at
# /var/data; without that disk everything would be lost on each deploy.
#
# The disk pins this service to a single instance, which the in-process rate
# limiter and the sync endpoints already assume.
#
# Secret values are marked sync:false and must be entered in the Render
# dashboard; never commit them here.

services:
  - type: web
    name: lex-indiana
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run check:prod-env && npm run db:deploy
    startCommand: npm start
    healthCheckPath: /login
    autoDeploy: true
    disk:
      name: lex-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.23.5
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/lex-indiana.db
      - key: AUTH_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_ROOT
        value: /var/data/storage
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: TWO_FACTOR_ISSUER
        value: Lex Indiana
      - key: REGISTRATION_MODE
        value: bootstrap
